<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(135deg, #74b9ff, #6c5ce7);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .login-box {
      width: 320px;
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    h3 {
      text-align: center;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
    button {
      background: #2f3640;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    #msg {
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="login-box">
  <h3>User Login</h3>

  <input type="text" id="name" placeholder="Name">
  <input type="text" id="userId" placeholder="User ID">

  <button onclick="login()">Login</button>
  <div id="msg"></div>
</div>

<script>
function login() {
  const name = document.getElementById("name").value.trim();
  const userId = document.getElementById("userId").value.trim();
  const msg = document.getElementById("msg");

  if (!name || !userId) {
    msg.innerHTML = "<span style='color:red'>Enter all fields</span>";
    return;
  }

  fetch("PASTE_YOUR_WEB_APP_URL_HERE", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, userId })
  })
  .then(res => res.json())
  .then(data => {
    if (data.status === "success") {
      sessionStorage.setItem("name", data.name);
      sessionStorage.setItem("role", data.role);
      window.location.href = "dashboard.html";
    } else {
      msg.innerHTML = "<span style='color:red'>Invalid Login</span>";
    }
  })
  .catch(() => {
    msg.innerHTML = "<span style='color:red'>Server error</span>";
  });
}
</script>

</body>
</html>
